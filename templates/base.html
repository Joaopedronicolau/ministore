<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MiniStore{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/extra.css') }}">
</head>
<body>
    <header>
        <nav>
            <a href="{{ url_for('dashboard.index') }}" class="marca">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l1-5h16l1 5"/><path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/>
                    <path d="M5 12v8h14v-8"/><path d="M10 20v-5h4v5"/>
                </svg>
                MiniStore
            </a>
            {% if session.get('usuario') %}
            <a href="{{ url_for('dashboard.index') }}">Dashboard</a>
            <a href="{{ url_for('clientes.listar') }}">Clientes</a>
            <a href="{{ url_for('categorias.listar') }}">Categorias</a>
            <a href="{{ url_for('produtos.listar') }}">Produtos</a>
            <a href="{{ url_for('vendas.listar') }}">Vendas</a>
            <span class="nav-usuario">
                Olá, {{ session.get('usuario') }}
                <a href="{{ url_for('auth.logout') }}">Sair</a>
            </span>
            {% endif %}
        </nav>
    </header>

    <main>
        {% for category, message in get_flashed_messages(with_categories=true) %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}

        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>MiniStore &copy; 2026</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
